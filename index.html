<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Proyecto - Keynmer</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/606/606259.png">
</head>
<body>
<audio id="sonidoClic" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
<div class="card">
    <h1 id="idTituloBienvenida">Sistema de Gestión de Personal</h1>
    <p>Terminal de Consulta Industrial</p>
<div class="registro-panel">
    <h3>Registrar Nuevo Operador</h3>
    <input type="text" id="regNombre" placeholder="Nombre Completo">
    <input type="text" id="regCedula" placeholder="Cédula">
    <input type="text" id="regCargo" placeholder="Cargo">
    <button onclick="registrarNuevo()">Guardar en Base de Datos</button>
</div>
    <!-- Buscador Principal -->
    <div class="search-container">
        <input type="text" id="nombreUsuario" placeholder="Ingrese Cédula del Operador...">
    </div>

    <hr> <!-- Una línea divisoria elegante -->

    <!-- Monitor de Datos -->
    <div id="monitorIndustrial">
        <div id="infoEmpleado">
            <p style="color: #94a3b8;">Esperando entrada de datos en terminal...</p>
        </div>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
